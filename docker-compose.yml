version: '3.8'

services:
  bot:
    build: .
    container_name: health_tracker_bot
    restart: unless-stopped

    # Переменные окружения из .env файла
    env_file:
      - .env

    # Volume для сохранения данных пользователей
    volumes:
      - ./user_data.json:/app/user_data.json

    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
